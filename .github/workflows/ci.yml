name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Audit tracked publication files
        run: python scripts/audit-publication.py --tracked
      - name: Install backend development dependencies
        run: ./scripts/setup.sh
      - name: Install media tools on the Linux runner
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install media tools on the Apple Silicon runner
        if: runner.os == 'macOS'
        run: brew install ffmpeg chromaprint
      - name: Validate Apple Silicon environment and login service
        if: runner.os == 'macOS'
        run: |
          .venv/bin/python scripts/macos-service.py print > /tmp/gravyflix-launch-agent.plist
          plutil -lint /tmp/gravyflix-launch-agent.plist
          .venv/bin/python -c "import platform; assert platform.machine() == 'arm64'"
      - name: Exercise media tools and bundled OCR models
        run: PYTHONPATH=backend .venv/bin/python scripts/check-media-runtime.py
      - name: Backend tests
        run: make test
      - name: Install Roku development tooling
        run: npm ci
      - name: Roku syntax and UI tests
        run: make roku-test-ui
